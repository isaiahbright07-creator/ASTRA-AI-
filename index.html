<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra AI</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#dde2ee;--accent:#f2a900;--accent-ink:#14213d;--err:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0c1222;--card:#152039;--ink:#eef1fa;--mute:#9aa6c4;--line:#27345a;--accent:#f5b82e;--accent-ink:#0c1222;--err:#ff8a80;--ok:#6ee7a8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 10px}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.logo b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 16px;cursor:pointer}
.primary{width:100%;background:var(--accent);color:var(--accent-ink);margin-top:16px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 0}
.tabs button{flex:1;background:transparent;color:var(--mute);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{margin-top:12px;font-size:14px}.err{color:var(--err)}.ok{color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px}
.tile.wide{grid-column:1/-1}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.row span:first-child{color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://xcmsnbqemxenkmlerljy.supabase.co";
const SUPABASE_KEY = "sb_publishable_6Vm4IZC29gpCp_T6OGpbOg_3YY6ZP1b";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
const LEVELS = [100,200,300,400,500,600];
let mode = "login", lists = {u:[],f:[],d:[]};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts = (arr, label="Select") => `<option value="">${label}</option>` + arr.map(o => `<option value="${esc(o.id ?? o)}">${esc(o.name ?? o)}</option>`).join("");
const levelOpts = sel => LEVELS.map(l => `<option value="${l}" ${l==sel?"selected":""}>${l} level</option>`).join("");
const semOpts = sel => [1,2].map(s => `<option value="${s}" ${s==sel?"selected":""}>${s==1?"First":"Second"} semester</option>`).join("");
const $ = id => document.getElementById(id);
const say = (text, cls="err") => { const m = $("msg"); if (m) { m.className = "msg " + cls; m.textContent = text; } };
const logo = `<div class="logo"><b>★</b> Astra AI</div>`;

async function loadLists() {
  const [u,f,d] = await Promise.all([
    sb.from("universities").select("id,name").order("name"),
    sb.from("faculties").select("id,name,university_id").order("name"),
    sb.from("departments").select("id,name,faculty_id").order("name")
  ]);
  lists = {u:u.data||[], f:f.data||[], d:d.data||[]};
}

function authView() {
  const signup = mode === "signup";
  app.innerHTML = `${logo}
  <h1>${signup ? "Create your account" : "Welcome back"}</h1>
  <p class="mute">${signup ? "Your tutor for lectures, notes and exams." : "Log in to continue studying."}</p>
  <div class="tabs"><button id="tLogin" class="${signup?"":"on"}">Log in</button><button id="tSign" class="${signup?"on":""}">Sign up</button></div>
  <div class="card">
    ${signup ? `<label for="name">Full name</label><input id="name" autocomplete="name">` : ""}
    <label for="email">Email address</label><input id="email" type="email" autocomplete="email">
    <label for="pass">Password</label><input id="pass" type="password" autocomplete="${signup?"new-password":"current-password"}" placeholder="${signup?"At least 8 characters":""}">
    ${signup ? `
    <label for="uni">University</label><select id="uni">${opts(lists.u)}</select>
    <label for="fac">Faculty</label><select id="fac"><option value="">Select university first</option></select>
    <label for="dep">Department</label><select id="dep"><option value="">Select faculty first</option></select>
    <div class="two"><div><label for="lvl">Level</label><select id="lvl">${levelOpts(100)}</select></div>
    <div><label for="sem">Semester</label><select id="sem">${semOpts(1)}</select></div></div>` : ""}
    <button class="primary" id="go">${signup ? "Create account" : "Log in"}</button>
    <div id="msg" class="msg"></div>
  </div>`;
  $("tLogin").onclick = () => { mode = "login"; authView(); };
  $("tSign").onclick = () => { mode = "signup"; authView(); };
  if (signup) {
    $("uni").onchange = () => { $("fac").innerHTML = opts(lists.f.filter(x => x.university_id === $("uni").value), "Select faculty"); $("dep").innerHTML = opts([], "Select faculty first"); };
    $("fac").onchange = () => { $("dep").innerHTML = opts(lists.d.filter(x => x.faculty_id === $("fac").value), "Select department"); };
  }
  $("go").onclick = signup ? doSignup : doLogin;
}

async function doLogin() {
  const btn = $("go"); btn.disabled = true; say("");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pass").value });
  btn.disabled = false;
  if (error) return say(error.message.includes("Email not confirmed") ? "Confirm your email first. Check your inbox." : "Wrong email or password.");
  route();
}

async function doSignup() {
  const v = { name: $("name").value.trim(), email: $("email").value.trim(), pass: $("pass").value, uni: $("uni").value, fac: $("fac").value, dep: $("dep").value, lvl: $("lvl").value, sem: $("sem").value };
  if (!v.name || !v.email || !v.uni || !v.fac || !v.dep) return say("Fill in every field.");
  if (v.pass.length < 8) return say("Password needs at least 8 characters.");
  const btn = $("go"); btn.disabled = true; say("");
  const { data, error } = await sb.auth.signUp({ email: v.email, password: v.pass, options: { data: { full_name: v.name, university_id: v.uni, faculty_id: v.fac, department_id: v.dep, level: v.lvl, semester: v.sem } } });
  btn.disabled = false;
  if (error) return say(error.message);
  if (!data.session) { say("Account created. Check your email to confirm it, then log in.", "ok"); return; }
  route();
}

async function dashView(session) {
  const { data: p, error } = await sb.from("profiles").select("*, universities(name), faculties(name), departments(name)").eq("id", session.user.id).single();
  if (error || !p) { app.innerHTML = `${logo}<div class="card"><p>We could not load your profile.</p><button class="ghost" id="out">Log out</button></div>`; $("out").onclick = logout; return; }
  const { data: courses } = await sb.from("courses").select("code,title").eq("department_id", p.department_id).eq("level", p.level).eq("semester", p.semester).order("code");
  const first = (p.full_name || "").split(" ")[0] || "there";
  app.innerHTML = `
  <div class="top">${logo}<button class="ghost" id="out">Log out</button></div>
  <h1>Hello, ${esc(first)}</h1>
  <p class="mute">${esc(p.departments?.name)}, ${esc(p.universities?.name)}</p>

  <div class="card"><h2>Your study space</h2>
    <div class="tiles">
      <div class="tile wide"><b>AI assistant</b><br><span class="mute">Coming soon</span></div>
      <div class="tile"><b>PDF study room</b><br><span class="mute">Coming soon</span></div>
      <div class="tile"><b>Teaching board</b><br><span class="mute">Coming soon</span></div>
    </div></div>

  <div class="card"><h2>Academic details</h2>
    <div class="row"><span>Faculty</span><span>${esc(p.faculties?.name)}</span></div>
    <div class="row"><span>Level</span><span>${esc(p.level)} level</span></div>
    <div class="row"><span>Semester</span><span>${p.semester==1?"First":"Second"}</span></div>
    <div class="row"><span>Plan</span><span>Free</span></div>
    <div class="two"><div><label for="lvl">Level</label><select id="lvl">${levelOpts(p.level)}</select></div>
    <div><label for="sem">Semester</label><select id="sem">${semOpts(p.semester)}</select></div></div>
    <button class="primary" id="save">Save changes</button><div id="msg" class="msg"></div></div>

  <div class="card"><h2>Your courses</h2>
    ${courses && courses.length ? courses.map(c => `<div class="row"><span>${esc(c.code)}</span><span>${esc(c.title)}</span></div>`).join("") : `<p class="mute">No courses yet. Your Head of Class will add them for your level.</p>`}
  </div>`;
  $("out").onclick = logout;
  $("save").onclick = async () => {
    const { error } = await sb.from("profiles").update({ level: +$("lvl").value, semester: +$("sem").value }).eq("id", p.id);
    error ? say("Could not save. Try again.") : (say("Saved.", "ok"), setTimeout(route, 600));
  };
}

async function logout() { await sb.auth.signOut(); mode = "login"; route(); }
async function route() {
  const { data } = await sb.auth.getSession();
  if (data.session) return dashView(data.session);
  await loadLists(); authView();
}
route();
</script>
</body>
</html>
