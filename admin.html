<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra AI Admin</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#dde2ee;--accent:#f2a900;--accent-ink:#14213d;--err:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0c1222;--card:#152039;--ink:#eef1fa;--mute:#9aa6c4;--line:#27345a;--accent:#f5b82e;--accent-ink:#0c1222;--err:#ff8a80;--ok:#6ee7a8}}
*{box-sizing:border-box}
body{border-top:8px solid var(--accent)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 6px}
p{margin:0 0 10px}.mute{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 16px;cursor:pointer}
.primary{width:100%;background:var(--accent);color:var(--accent-ink);margin-top:14px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 12px;font-weight:600;text-decoration:none;font-size:15px}
.msg{margin-top:10px;font-size:14px}.err{color:var(--err)}.ok{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border:0}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient("https://xcmsnbqemxenkmlerljy.supabase.co", "sb_publishable_6Vm4IZC29gpCp_T6OGpbOg_3YY6ZP1b");
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts = (arr, label) => `<option value="">${label}</option>` + arr.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join("");
const lines = id => $(id).value.split("\n").map(s => s.trim()).filter(Boolean);
const say = (id, t, c="err") => { $(id).className = "msg " + c; $(id).textContent = t; };
let L = {u:[], f:[], d:[]};

async function load() {
  const [u,f,d] = await Promise.all([
    sb.from("universities").select("id,name").order("name"),
    sb.from("faculties").select("id,name,university_id").order("name"),
    sb.from("departments").select("id,name,faculty_id").order("name")
  ]);
  L = {u:u.data||[], f:f.data||[], d:d.data||[]};
}

async function init() {
  const { data: s } = await sb.auth.getSession();
  if (!s.session) { app.innerHTML = `<h1>Admin</h1><p>Log in first on the <a href="index.html">main page</a>, then come back here.</p>`; return; }
  const { data: p } = await sb.from("profiles").select("role").eq("id", s.session.user.id).single();
  if (!p || p.role !== "admin") { app.innerHTML = `<h1>No access</h1><p>This page is for administrators only.</p><a class="ghost" href="index.html">Back to dashboard</a>`; return; }
  await load(); render();
}

function render() {
  app.innerHTML = `
  <div class="top"><h1>Admin</h1><a class="ghost" href="index.html">Dashboard</a></div>
  <p class="mute">Add one item per line. Items that already exist are skipped, so it is safe to paste a list twice.</p>

  <div id="review"><p class="mute">Loading…</p></div>

  <div class="card"><h2>1. Add faculties</h2>
    <label for="fu">University</label><select id="fu">${opts(L.u, "Select university")}</select>
    <label for="ft">Faculty names (one per line)</label><textarea id="ft" placeholder="Faculty of Science"></textarea>
    <button class="primary" id="fb">Add faculties</button><div id="fm" class="msg"></div></div>

  <div class="card"><h2>2. Add departments</h2>
    <label for="df">Faculty</label><select id="df">${opts(L.f, "Select faculty")}</select>
    <label for="dt">Department names (one per line)</label><textarea id="dt" placeholder="Department of Physics"></textarea>
    <button class="primary" id="db">Add departments</button><div id="dm" class="msg"></div></div>

  <div class="card"><h2>3. Add courses</h2>
    <label for="cf">Faculty</label><select id="cf">${opts(L.f, "Select faculty")}</select>
    <label for="cd">Department</label><select id="cd"><option value="">Select faculty first</option></select>
    <div class="two"><div><label for="cl">Level</label><select id="cl">${[100,200,300,400,500,600].map(l=>`<option value="${l}">${l} level</option>`).join("")}</select></div>
    <div><label for="cs">Semester</label><select id="cs"><option value="1">First</option><option value="2">Second</option></select></div></div>
    <label for="ct">Courses, one per line as CODE | Title</label>
    <textarea id="ct" placeholder="AEF 301 | Farm Management I"></textarea>
    <button class="primary" id="cb">Add courses</button><div id="cm" class="msg"></div>
    <div id="clist"></div></div>`;

  $("fb").onclick = addFaculties;
  $("db").onclick = addDepartments;
  $("cf").onchange = () => { $("cd").innerHTML = opts(L.d.filter(x => x.faculty_id === $("cf").value), "Select department"); $("clist").innerHTML = ""; };
  $("cd").onchange = showCourses;
  $("cl").onchange = showCourses; $("cs").onchange = showCourses;
  $("cb").onclick = addCourses;
  review();
}

async function addFaculties() {
  const uid = $("fu").value, names = lines("ft");
  if (!uid || !names.length) return say("fm", "Choose a university and enter at least one name.");
  const { error } = await sb.from("faculties").upsert(names.map(name => ({ university_id: uid, name })), { onConflict: "university_id,name", ignoreDuplicates: true });
  if (error) return say("fm", error.message);
  await load(); render(); say("fm", `Done. ${names.length} faculty name(s) processed.`, "ok");
}

async function addDepartments() {
  const fid = $("df").value, names = lines("dt");
  if (!fid || !names.length) return say("dm", "Choose a faculty and enter at least one name.");
  const { error } = await sb.from("departments").upsert(names.map(name => ({ faculty_id: fid, name })), { onConflict: "faculty_id,name", ignoreDuplicates: true });
  if (error) return say("dm", error.message);
  await load(); render(); say("dm", `Done. ${names.length} department name(s) processed.`, "ok");
}

async function addCourses() {
  const did = $("cd").value, level = +$("cl").value, semester = +$("cs").value;
  if (!did) return say("cm", "Choose a faculty and department.");
  const rows = [], bad = [];
  lines("ct").forEach(l => { const [code, ...rest] = l.split("|"); const title = rest.join("|").trim(); (code.trim() && title) ? rows.push({ department_id: did, code: code.trim().toUpperCase(), title, level, semester }) : bad.push(l); });
  if (bad.length) return say("cm", `Fix this line (use CODE | Title): ${bad[0]}`);
  if (!rows.length) return say("cm", "Enter at least one course.");
  const { error } = await sb.from("courses").upsert(rows, { onConflict: "department_id,code", ignoreDuplicates: true });
  if (error) return say("cm", error.message);
  $("ct").value = ""; say("cm", `Done. ${rows.length} course(s) processed.`, "ok"); showCourses();
}

async function showCourses() {
  const did = $("cd").value; if (!did) { $("clist").innerHTML = ""; return; }
  const { data } = await sb.from("courses").select("code,title").eq("department_id", did).eq("level", +$("cl").value).eq("semester", +$("cs").value).order("code");
  $("clist").innerHTML = `<label>Already added for this level and semester</label>` + (data && data.length ? data.map(c => `<div class="row"><span>${esc(c.code)}</span><span>${esc(c.title)}</span></div>`).join("") : `<p class="mute">None yet.</p>`);
}
async function review() {
  const uid = (await sb.auth.getSession()).data.session.user.id;
  const [ap, hs, dn] = await Promise.all([
    sb.from("hoc_applications").select("id,level,profiles!user_id(full_name,matric_number),departments(name)").eq("status", "pending").order("created_at"),
    sb.from("hoc_assignments").select("id,level,kind,profiles!user_id(full_name,matric_number),departments(name)").eq("active", true).order("created_at"),
    sb.from("profiles").select("id,full_name,matric_number,level,departments(name)").eq("verification_status", "denied")
  ]);
  const A = ap.data || [], H = hs.data || [], D = dn.data || [];
  const who = (n, m, d, l) => `<b>${esc(n)}</b><br><span class="mute">${esc(m || "No matric number")} · ${esc(d)} · ${l} level</span>`;
  const btns = h => `<div style="display:flex;gap:8px;margin-top:8px">${h}</div>`;
  $("review").innerHTML = `
  <div class="card"><h2>HOC applications</h2><div id="rm" class="msg"></div>
  ${A.length ? A.map(a => `<div class="row" style="display:block">${who(a.profiles?.full_name, a.profiles?.matric_number, a.departments?.name, a.level)}${btns(`<button class="primary" style="margin:0;width:auto" data-ap="${a.id}">Approve</button><button class="ghost" data-rj="${a.id}">Reject</button>`)}</div>`).join("") : `<p class="mute">No applications waiting.</p>`}</div>
  <div class="card"><h2>Current HOCs and assistants</h2>
  ${H.length ? H.map(a => `<div class="row" style="display:block">${who(a.profiles?.full_name, a.profiles?.matric_number, a.departments?.name, a.level)}<span class="mute">${a.kind === "hoc" ? "Head of Class" : "Assistant"}</span>${btns(`<button class="ghost" data-rv="${a.id}">Remove</button>`)}</div>`).join("") : `<p class="mute">None yet.</p>`}</div>
  <div class="card"><h2>Denied students</h2><p class="mute">Blocked by an HOC. Restore anyone who was denied by mistake.</p>
  ${D.length ? D.map(s => `<div class="row" style="display:block">${who(s.full_name, s.matric_number, s.departments?.name, s.level)}${btns(`<button class="ghost" data-rs="${s.id}">Restore</button>`)}</div>`).join("") : `<p class="mute">Nobody denied.</p>`}</div>`;
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  on("[data-ap]", async b => { const { error } = await sb.rpc("approve_hoc_application", { p_id: b.dataset.ap }); error ? say("rm", error.message) : review(); });
  on("[data-rj]", async b => { if (!confirm("Reject this application?")) return; const { error } = await sb.from("hoc_applications").update({ status: "rejected", reviewed_by: uid, reviewed_at: new Date().toISOString() }).eq("id", b.dataset.rj); error ? say("rm", error.message) : review(); });
  on("[data-rv]", async b => { if (!confirm("Remove this person? If they are the HOC, their assistant is removed too.")) return; const { error } = await sb.rpc("revoke_hoc", { p_id: b.dataset.rv }); error ? say("rm", error.message) : review(); });
  on("[data-rs]", async b => { if (!confirm("Restore this student? They go back to waiting for confirmation.")) return; const { error } = await sb.from("profiles").update({ status: "active", verification_status: "pending" }).eq("id", b.dataset.rs); error ? say("rm", error.message) : review(); });
}

init();
</script>
</body>
</html>
